name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gates:
    name: Code Quality and Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'backend/requirements*.txt'
        
    - name: Install dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install faker factory-boy locust pytest-cov httpx black
        
    - name: Run Ruff Linting
      working-directory: backend
      run: ruff check .
      
    - name: Run Black Formatting Check
      working-directory: backend
      run: black --check .
      
    - name: Run Mypy Type Checking
      working-directory: backend
      run: mypy .
        
    - name: Run Tests with coverage
      working-directory: backend
      run: pytest
      env:
        DATABASE_URL: sqlite+aiosqlite:///:memory:
        ENVIRONMENT: test
        CLERK_SECRET_KEY: test_key
        CLERK_WEBHOOK_SECRET: test_secret

    - name: Validate Alembic Migrations
      working-directory: backend
      run: alembic upgrade head --sql
      env:
        DATABASE_URL: sqlite+aiosqlite:///:memory:
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Build Frontend
      working-directory: frontend
      run: |
        npm ci || npm install
        npm run build

  deploy:
    name: Deploy to Production
    needs: quality-gates
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Node.js for Vercel CLI
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Deploy Frontend to Vercel
      working-directory: frontend
      run: |
        npm install -g vercel
        vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        
    - name: Deploy Backend to Hugging Face Spaces
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        git push https://user:$HF_TOKEN@huggingface.co/spaces/${{ secrets.HF_SPACE_ID }} main
